plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.36'; id 'org.spongepowered.mixin' version '0.7.38' }
group = 'dev.arsfusion'
version = file('../VERSION').text.trim()
base { archivesName = 'ars-fusion' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
repositories { flatDir { dirs 'libs' }; mavenCentral { content { excludeGroup 'local' } } }
sourceSets {
    main { java.srcDir '../common/src/main/java'; resources.srcDir '../common/src/main/resources' }
    forgeTest { java.srcDir '../common/src/gameTest/java'; compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
}
configurations { forgeTestImplementation.extendsFrom implementation; forgeTestCompileOnly.extendsFrom compileOnly; forgeTestRuntimeOnly.extendsFrom runtimeOnly }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        gameTestServer {
            workingDirectory project.file(providers.gradleProperty('withoutIron').getOrElse('false').toBoolean() ? 'run/no-iron' : 'run/gametest')
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(providers.gradleProperty('withoutIron').getOrElse('false').toBoolean() ? 'ars_fusion' : 'ars_fusion,ars_fusion_iron')
            jvmArgs '-Xmx1000m'
            mods { ars_fusion { source sourceSets.main; source sourceSets.forgeTest } }
        }
        client { workingDirectory project.file('run/client'); mods { ars_fusion { source sourceSets.main } } }
    }
}
mixin { add sourceSets.main, 'ars_fusion.refmap.json'; config 'ars_fusion.mixins.json' }
tasks.named('compileJava') {
    // MixinGradle removes generated mappings before compilation. An incremental compile
    // of only non-Mixin classes can skip the processor and silently lose the refmap.
    options.incremental = false
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')).withPropertyName('mixinRefmap')
    outputs.file(layout.buildDirectory.file('tmp/compileJava/ars_fusion.refmap.json')).withPropertyName('packagedMixinRefmap')
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')).withPropertyName('mixinMappings')
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    for (name in ['ars-nouveau','irons-spells-n-spellbooks','geckolib','curios','patchouli','playeranimator','irons-lib','jei']) {
        if (providers.gradleProperty('withoutIron').getOrElse('false').toBoolean() && name in ['irons-spells-n-spellbooks','irons-lib','playeranimator']) compileOnly fg.deobf("local:${name}:forge1201")
        else implementation fg.deobf("local:${name}:forge1201")
    }
    compileOnly fg.deobf('local:ars-conflux:coexist')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    if (providers.gradleProperty('coexist').getOrElse('false').toBoolean()) runtimeOnly fg.deobf('local:irons-nouveau:coexist')
    if (providers.gradleProperty('coexist').getOrElse('false').toBoolean()) runtimeOnly fg.deobf('local:ars-conflux:coexist')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand(version: project.version) } }
tasks.named('jar') { from('../LICENSE'); archiveFileName = "ars-fusion-${project.version}-mc1.20.1-forge.jar"; manifest { attributes 'MixinConfigs': 'ars_fusion.mixins.json' }; finalizedBy 'reobfJar' }
tasks.named('sourcesJar') { from('../LICENSE') }

// Forge release checks run against the reobfuscated archive, not the development classes.
tasks.register('verifyRelease') {
    dependsOn 'reobfJar'
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entry = zip.getEntry('ars_fusion.refmap.json')
            if (entry == null || zip.getEntry('LICENSE') == null) throw new GradleException('Missing release refmap or MIT license')
            def mappings = zip.getInputStream(entry).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream) }
            def target = mappings.mappings?.get('dev/arsfusion/mixin/FusedArmorNameMixin')?.get('getHoverName')
            if (target == null || !target.contains('m_41786_')) throw new GradleException('ItemStack.getHoverName is not mapped to the production target')
            [
                'dev/arsfusion/mixin/FusedCrossbowUseMixin': [
                    'use':'m_41682_',
                    'Lnet/minecraft/world/item/Item;use(Lnet/minecraft/world/level/Level;Lnet/minecraft/world/entity/player/Player;Lnet/minecraft/world/InteractionHand;)Lnet/minecraft/world/InteractionResultHolder;':'m_7203_'],
                'dev/arsfusion/mixin/FusedShieldRepairMixin': ['inventoryTick':'m_41666_'],
                'dev/arsfusion/mixin/FusedShieldBlockMixin': ['Lnet/minecraft/world/item/ItemStack;getItem()Lnet/minecraft/world/item/Item;':'m_41720_'],
                'dev/arsfusion/mixin/FusedBowReleaseMixin': [
                    'releaseUsing':'m_41674_',
                    'Lnet/minecraft/world/item/Item;releaseUsing(Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/level/Level;Lnet/minecraft/world/entity/LivingEntity;I)V':'m_5551_'],
                'dev/arsfusion/mixin/BowAmmoMixin': [
                    'getProjectile':'m_6298_',
                    'Lnet/minecraft/world/item/ProjectileWeaponItem;getSupportedHeldProjectiles()Ljava/util/function/Predicate;':'m_6442_',
                    'Lnet/minecraft/world/item/ProjectileWeaponItem;getAllSupportedProjectiles()Ljava/util/function/Predicate;':'m_6437_'],
                'dev/arsfusion/mixin/BowArrowAccessor': ['setPierceLevel':'m_36767_'],
                'dev/arsfusion/mixin/BowProjectileSaveMixin': ['load':'m_20258_', 'saveWithoutId':'m_20240_'],
                'dev/arsfusion/mixin/FusedSwordHitMixin': [
                    'hurtEnemy':'m_41640_',
                    'Lnet/minecraft/world/item/Item;hurtEnemy(Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/entity/LivingEntity;Lnet/minecraft/world/entity/LivingEntity;)Z':'m_7579_'],
                'dev/arsfusion/mixin/NativeSwordPhysicalMixin': [
                    'hurtEnemy':'m_7579_',
                    'Lnet/minecraft/world/item/SwordItem;hurtEnemy(Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/entity/LivingEntity;Lnet/minecraft/world/entity/LivingEntity;)Z':'m_7579_'],
                'dev/arsfusion/mixin/SwordScribingMixin': [
                    'use':'m_6227_',
                    'Lnet/minecraft/world/item/ItemStack;getItem()Lnet/minecraft/world/item/Item;':'m_41720_']
            ].each { mixinName, targets ->
                targets.each { selector, mapped ->
                    def value=mappings.mappings?.get(mixinName)?.get(selector)
                    if(value==null || !value.contains(mapped) || mappings.data?.searge?.get(mixinName)?.get(selector)!=value)
                        throw new GradleException("Unmapped production casting hook: ${mixinName} ${selector}")
                }
            }
            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).withCloseable { stream -> new java.util.jar.Manifest(stream) }
            if (manifest.mainAttributes.getValue('MixinConfigs') != 'ars_fusion.mixins.json') throw new GradleException('Missing MixinConfigs manifest')
        }
    }
}
